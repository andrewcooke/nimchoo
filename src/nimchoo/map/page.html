<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="{{leaflet-css}}" integrity="{{leaflet-css-hash}}" crossorigin="">
<style>
  html, body, #map { height: 100%; margin: 0; }
  #caption { position: absolute; z-index: 1000; left: 54px; top: 10px; padding: 4px 8px;
             background: rgba(255, 255, 255, 0.85); font: 13px sans-serif; border-radius: 3px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="caption">loading the routes ...</div>
<script src="{{leaflet-js}}" integrity="{{leaflet-js-hash}}" crossorigin=""></script>
<script>
  const caption = document.getElementById('caption');
  const map = L.map('map', { preferCanvas: true });
  L.tileLayer('{{{tiles}}}', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  const text = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  fetch('/files/{{{data}}}')
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then((data) => {
      // what a thing looks like is decided here, from what it is (its `kind`); the file says only what things are
      const climbColours = { HC: '#e03131', 1: '#f08c00', 2: '#fab005', 3: '#2f9e44', 4: '#1971c2' };
      const ofKind = (kind) => (f) => (f.properties || {}).kind === kind;
      const routes = L.geoJSON(data, {
        filter: ofKind('route'),
        style: { color: '#c2185b', weight: 2, opacity: 0.25 },
        onEachFeature: (f, l) => {
          const p = f.properties || {};
          l.bindPopup(text(p.start || '') + '<br>' + text(p.sport || '') + ' ' +
                      (p.distance_m ? (p.distance_m / 1000).toFixed(1) + 'km' : ''));
        }
      }).addTo(map);
      const climbs = L.geoJSON(data, {
        filter: ofKind('climb'),
        style: (f) => ({ color: climbColours[(f.properties || {}).category] || '#868e96', weight: 5, opacity: 0.9 }),
        onEachFeature: (f, l) => {
          const p = f.properties || {};
          const facts = (p.category ? 'category ' + text(p.category) + ', ' : '') + (p.length_m / 1000).toFixed(1) + 'km, +' +
                        Math.round(p.gain_m) + 'm, ' + p.gradient.toFixed(1) + '%';
          l.bindTooltip(text(p.name || ''), { sticky: true });
          l.bindPopup('<b>' + text(p.name || '') + '</b><br>' + facts);
        }
      }).addTo(map);
      const bounds = routes.getBounds();
      if (bounds.isValid()) map.fitBounds(bounds); else map.setView([0, 0], 2);
      const n = data.features.filter(ofKind('route')).length;
      const m = data.features.filter(ofKind('climb')).length;
      caption.textContent = n + ' routes' + (m ? ', ' + m + ' climbs' : '');
    })
    .catch((e) => { caption.textContent = 'could not load the routes: ' + e; });
</script>
</body>
</html>
