<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="{{leaflet-css}}" integrity="{{leaflet-css-hash}}" crossorigin="">
<style>
{{{css}}}</style>
</head>
<body>
<div id="map"></div>
<div id="caption">loading the map ...</div>
<div id="cursor"></div>
<script src="{{leaflet-js}}" integrity="{{leaflet-js-hash}}" crossorigin=""></script>
<script>
  const caption = document.getElementById('caption');
  const cursor = document.getElementById('cursor');
  const map = L.map('map', { preferCanvas: true });
  L.tileLayer('{{{tiles}}}', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  // where the pointer is, in degrees (to compare the map with numbers: latitude first, then longitude)
  map.on('mousemove', (e) => { cursor.textContent = 'lat ' + e.latlng.lat.toFixed(5) + '  lon ' + e.latlng.lng.toFixed(5); });
  map.on('mouseout', () => { cursor.textContent = ''; });
  // --- what the drawings of the frames may use (`ctx.helpers`): the map knows no frame, each draws its own (map/frames.nim)
  const metresPerDegree = 111320;
  const text = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  // the metres a pixel is across, at a zoom and a latitude (the map's tiles are 256 pixels wide at zoom 0)
  const metresPerPixel = (zoom, lat) => 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const mix = (a, b, t) => '#' + a.map((x, i) => Math.round(x + (b[i] - x) * t).toString(16).padStart(2, '0')).join('');

  // the points of a path moved `offsetM` metres to the left of the direction of travel (negative: to the right).
  // At a corner the point moves along the bisector, at most twice as far, so that a sharp bend does not make a spike.
  function offsetPath(points, offsetM) {
    const n = points.length;
    if (n < 2 || offsetM === 0) return points;
    const kx = metresPerDegree * Math.cos(points[0][1] * Math.PI / 180), ky = metresPerDegree;
    const xy = points.map((p) => [p[0] * kx, p[1] * ky]);
    const direction = [];                                         // the unit direction of each segment (null if it has no length)
    for (let i = 0; i + 1 < n; i++) {
      const dx = xy[i + 1][0] - xy[i][0], dy = xy[i + 1][1] - xy[i][1], d = Math.hypot(dx, dy);
      direction.push(d > 0 ? [dx / d, dy / d] : null);
    }
    const nearest = (i, step) => { for (let j = i; j >= 0 && j < direction.length; j += step) if (direction[j]) return direction[j]; return null; };
    return points.map((p, i) => {
      const before = nearest(i - 1, -1) || nearest(i, 1), after = nearest(i, 1) || nearest(i - 1, -1);
      if (!before || !after) return p;
      const n1 = [-before[1], before[0]], n2 = [-after[1], after[0]];
      let bx = n1[0] + n2[0], by = n1[1] + n2[1];
      const len = Math.hypot(bx, by);
      if (len < 1e-9) { bx = n1[0]; by = n1[1]; } else { bx /= len; by /= len; }
      const scale = 1 / Math.max(bx * n1[0] + by * n1[1], 0.5);
      return [p[0] + bx * offsetM * scale / kx, p[1] + by * offsetM * scale / ky].concat(p.slice(2));
    });
  }

  // corner cutting (Chaikin): each corner is replaced by two points a quarter of the way along each side, again and again, so
  // that a polyline becomes a smooth curve that stays close to it (it never swings out past a corner, as some splines do).  The
  // ends stay where they are, and the height (a third number) is carried along.
  function smoothPath(points, rounds) {
    let p = points;
    for (let r = 0; r < rounds && p.length > 2; r++) {
      const q = [p[0]];
      for (let i = 0; i + 1 < p.length; i++) {
        const a = p[i], b = p[i + 1];
        q.push(a.map((v, k) => 0.75 * v + 0.25 * b[k]));
        q.push(a.map((v, k) => 0.25 * v + 0.75 * b[k]));
      }
      q.push(p[p.length - 1]);
      p = q;
    }
    return p;
  }

  // a path with fewer points, none of it further than `tolM` metres from the original (Douglas-Peucker)
  function simplifyPath(points, tolM) {
    const n = points.length;
    if (n < 3 || tolM <= 0) return points;
    const kx = metresPerDegree * Math.cos(points[0][1] * Math.PI / 180), ky = metresPerDegree;
    const x = points.map((p) => p[0] * kx), y = points.map((p) => p[1] * ky);
    const keep = new Array(n).fill(false);
    keep[0] = keep[n - 1] = true;
    const stack = [[0, n - 1]];
    while (stack.length) {
      const [a, b] = stack.pop();
      let far = -1, farD = tolM;
      const dx = x[b] - x[a], dy = y[b] - y[a], len = Math.hypot(dx, dy);
      for (let i = a + 1; i < b; i++) {
        const d = len > 0 ? Math.abs(dx * (y[a] - y[i]) - (x[a] - x[i]) * dy) / len : Math.hypot(x[i] - x[a], y[i] - y[a]);
        if (d > farD) { farD = d; far = i; }
      }
      if (far >= 0) { keep[far] = true; stack.push([a, far], [far, b]); }
    }
    return points.filter((p, i) => keep[i]);
  }

  const helpers = { metresPerDegree, text, metresPerPixel, rgb, mix, offsetPath, smoothPath, simplifyPath };

  // --- the frames: what is common to them (map-style.json), and each with its file, its own style and the name of its drawing
  const common = {{{style}}};
  const frames = {{{frames}}};
  const drawers = {};
{{{drawers}}}
  // the drawing of a frame that ships none: lines, polygons and points from its style alone, every property in a popup
  function generic(features, ctx) {
    const s = ctx.style;
    const look = { color: s.color, weight: s.weight ?? 3, opacity: s.opacity ?? 1, fillColor: s.color, fillOpacity: s.fill_opacity ?? 0.3 };
    const layer = L.geoJSON({ type: 'FeatureCollection', features }, {
      style: look,
      pointToLayer: (f, at) => L.circleMarker(at, Object.assign({ radius: s.radius ?? 5 }, look)),
      onEachFeature: (f, l) => {
        const p = f.properties || {};
        l.bindPopup(Object.keys(p).map((k) => text(k) + ': ' + text(String(p[k]))).join('<br>'));
      }
    });
    ctx.add(layer, 50);
    return { bounds: layer.getBounds(), rank: 2, caption: features.length ? features.length + ' ' + ctx.name : '' };
  }

  // one file for each frame, fetched on its own: a frame that cannot be read or drawn is said so, and the others are drawn.  The
  // layers of all of them are added in order of their `z` (so what is underneath does not depend on the order of the frames),
  // then the view is fitted to the frames of the lowest rank that have any, then each frame is brought up to date with the view.
  const shared = {};
  Promise.allSettled(frames.map((f) => fetch('/files/' + f.file)
      .then((r) => { if (!r.ok) throw new Error(f.file + ': HTTP ' + r.status); return r.json(); })))
    .then((results) => {
      const failed = [], drawn = [], layers = [];
      results.forEach((r, i) => {
        const f = frames[i];
        if (r.status === 'rejected') { failed.push(String(r.reason)); return; }
        const ctx = { map, L, name: f.name.split('/').pop(), style: f.style, common, shared, helpers,
                      add: (layer, z) => layers.push({ layer, z: z ?? 50, k: layers.length }) };
        try { drawn.push((f.drawer ? drawers[f.drawer] : generic)(r.value.features || [], ctx) || {}); }
        catch (e) { failed.push(f.name + ': ' + e); }
      });
      layers.sort((a, b) => a.z - b.z || a.k - b.k).forEach((a) => a.layer.addTo(map));
      let bounds = null, rank = Infinity;
      for (const d of drawn) {
        if (!d.bounds || !d.bounds.isValid()) continue;
        const r = d.rank ?? 2;
        if (r < rank) { rank = r; bounds = L.latLngBounds(d.bounds.getSouthWest(), d.bounds.getNorthEast()); }
        else if (r === rank) bounds.extend(d.bounds);
      }
      if (bounds) map.fitBounds(bounds); else map.setView([0, 0], 2);
      for (const d of drawn) if (d.update) { d.update(); map.on('zoomend', d.update); }
      caption.textContent = drawn.map((d) => d.caption).filter((c) => c).join(', ') +
                            (failed.length ? ' (could not load: ' + failed.join('; ') + ')' : '');
    })
    .catch((e) => { caption.textContent = 'could not draw the map: ' + e; });
</script>
</body>
</html>
