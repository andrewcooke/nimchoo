<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; color: #222; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  #frames label, #picks label, #axis label { margin-right: 14px; cursor: pointer; }
  #axis { margin-top: 4px; }
  #picks { margin-top: 4px; max-height: 7.5em; overflow-y: auto; }
  #picks label { display: inline-block; }
  #info { color: #666; margin: 4px 0 8px; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 8px 0 0; }
  .panel svg { touch-action: none; user-select: none; cursor: grab; }
</style>
</head>
<body>
<h1>{{title}}</h1>
<div id="frames"></div>
<div id="axis"></div>
<div id="picks"></div>
<div id="info">loading ...</div>
<div id="panels"></div>
<script src="{{d3-js}}" integrity="{{d3-js-hash}}" crossorigin=""></script>
<script src="{{plot-js}}" integrity="{{plot-js-hash}}" crossorigin=""></script>
<script>
  // the frames of the subject (plot/frames.nim): each fetched from this page's own address with &frame=NAME (a CSV of
  // time, series, value), the first time it is ticked, and drawn in a panel of its own; all the panels share the x axis.
  // Over days (axis 'days') x is the time; over the time of one activity (axis 'activity') each frame is fetched for each
  // activity ticked (&activity=ID), and x is the seconds from that activity's start, so they lie over one another.  A
  // value that is NaN breaks a line (a pause).
  const frames = {{{frames}}};
  const axis = '{{axis}}';
  const picks = {{{picks}}};     // for axis 'activity': the activities to tick, the newest first ({ id, start, label })
  const day = 86400000;
  const panels = document.getElementById('panels');
  const info = document.getElementById('info');
  const data = new Map();       // frame (and activity) -> a promise of its points ({ x, series, value })
  let zoom = null;              // [from, to] (numbers on the x axis: a time is its milliseconds) zoomed to, else null: everything
  let full = null;              // [from, to] of everything drawn
  const overActivity = axis === 'activity';
  for (const [i, p] of picks.entries()) p.shown = i === 0;
  // each activity ticked keeps its colour while it is ticked: the first free one when it is ticked (so the ones shown are
  // the most distinct, and ticking another changes no colour already there)
  const palette = d3.schemeTableau10;
  const colourOf = new Map();   // the label of a ticked activity -> its place in the palette
  function takeColour(p) {
    let i = 0;
    while ([...colourOf.values()].includes(i)) i++;
    colourOf.set(p.label, i % palette.length);
  }
  for (const p of picks) if (p.shown) takeColour(p);
  // over activities, x is the time from each one's start, or the values of a frame that grows along it (the distance)
  const alongFrames = frames.filter((f) => f.along);
  let xFrame = null;            // the frame that is the x axis, else null: the time

  function load(f, pick) {
    const key = f.name + (pick ? '/' + pick.id : '');
    if (!data.has(key)) {
      const q = new URLSearchParams(location.search);
      q.set('frame', f.name);
      if (pick) q.set('activity', pick.id);
      q.delete('token');
      data.set(key, fetch(location.pathname + '?' + q.toString())
        .then((r) => { if (!r.ok) throw new Error(f.name + ': HTTP ' + r.status); return r.text(); })
        // (csvParseRows, not csvParse: with a row function that one evals code, which the page's content-security policy forbids)
        .then((text) => d3.csvParseRows(text).slice(1).map((d) => pick
          ? { s: (new Date(d[0]) - pick.start * 1000) / 1000, x: (new Date(d[0]) - pick.start * 1000) / 1000, series: pick.label, value: +d[2] }
          : { x: new Date(d[0]), series: d[1], value: +d[2] })));
    }
    return data.get(key);
  }

  // points with x the value of `along` at their time (each from the activity's start), interpolated between its readings;
  // a point outside them, or an activity without them, is left out (and said)
  const without = new Set();    // the activities that have none of the frame that is the x axis
  function placed(points, along, pick) {
    const known = along.filter((d) => !Number.isNaN(d.value));
    if (known.length === 0) { without.add(pick.label); return []; }
    const at = d3.bisector((d) => d.s).left;
    return points.flatMap((d) => {
      if (Number.isNaN(d.value)) return [{ ...d, x: NaN }];
      const i = at(known, d.s);
      if (i >= known.length || (i === 0 && known[0].s > d.s)) return [];
      if (known[i].s === d.s || i === 0) return [{ ...d, x: known[i].value }];
      const [a, b] = [known[i - 1], known[i]];
      return [{ ...d, x: a.value + (b.value - a.value) * (d.s - a.s) / (b.s - a.s) }];
    });
  }

  // the points of a frame: over days, its own; over activities, those of each activity ticked, on the x chosen
  function pointsOf(f) {
    if (!overActivity) return load(f, null);
    return Promise.all(picks.filter((p) => p.shown).map((p) => xFrame
      ? Promise.all([load(f, p), load(xFrame, p)]).then(([points, along]) => placed(points, along, p))
      : load(f, p))).then((all) => all.flat());
  }

  // seconds from the start as h:mm
  const hm = (s) => Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0');

  // ticks on round times (a step of minutes or hours, at most 8 ticks) between two numbers of seconds
  function timeTicks(domain) {
    if (!domain) return undefined;
    const [a, b] = domain;
    const step = [60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600].find((s) => (b - a) / s <= 8) || 21600;
    const ticks = [];
    for (let t = Math.ceil(a / step) * step; t <= b; t += step) ticks.push(t);
    return ticks;
  }

  function marks(f, points) {
    if (f.mark === 'bar')
      return [Plot.rectY(points, { x1: 'x', x2: (d) => new Date(+d.x + day), y: 'value', fill: 'series', inset: 0.5 }),
              Plot.tip(points, Plot.pointerX({ x: 'x', y: 'value', fill: 'series' }))];
    return [Plot.lineY(points, { x: 'x', y: 'value', stroke: 'series', strokeWidth: 1.5 }),
            Plot.tip(points, Plot.pointerX({ x: 'x', y: 'value', stroke: 'series',
                                             title: overActivity ? (d) => d.series + '\n' + hm(d.s) +
                                               (xFrame ? '  ' + d.x.toFixed(2) + ' ' + xFrame.unit : '') + '  ' + d.value : undefined }))];
  }

  async function draw() {
    without.clear();
    const shown = frames.filter((f) => f.shown && f !== xFrame); // (the x axis against itself is a diagonal)
    const loaded = await Promise.allSettled(shown.map(pointsOf));
    const failed = [];
    const ready = [];
    loaded.forEach((r, i) => { if (r.status === 'fulfilled') ready.push([shown[i], r.value]); else failed.push(String(r.reason)); });
    const all = ready.flatMap(([, points]) => points).filter((d) => !Number.isNaN(d.x));
    const extent = overActivity ? [0, d3.max(all, (d) => d.x) || 0] : d3.extent(all, (d) => d.x);
    full = all.length ? extent.map(Number) : null;
    const span = zoom || full;
    const domain = span ? (overActivity ? span : span.map((v) => new Date(v))) : undefined;
    const height = Math.max(160, (window.innerHeight - 140) / Math.max(1, ready.length) - 30);
    const drawn = ready.map(([f, points]) => {
      const visible = zoom ? points.filter((d) => Number.isNaN(+d.x) || (+d.x >= zoom[0] && +d.x <= zoom[1])) : points;
      const plot = Plot.plot({
        width: Math.max(300, window.innerWidth - 32),
        height,
        x: !overActivity ? { type: 'time', label: null, domain }
          : xFrame ? { type: 'linear', label: xFrame.name + ' (' + xFrame.unit + ')', domain }
          : { type: 'linear', label: 'time from the start', domain, ticks: timeTicks(domain), tickFormat: hm },
        y: { grid: true, label: f.unit },
        color: overActivity
          ? { legend: true, domain: [...colourOf.keys()], range: [...colourOf.values()].map((i) => palette[i]) }
          : { legend: true },
        marks: marks(f, visible)
      });
      const panel = document.createElement('div');
      panel.className = 'panel';
      const h = document.createElement('h2');
      h.textContent = f.name + ' (' + f.summary + ')';
      panel.append(h, plot);
      // (`plot` is a figure with the legend, whose last svg is the chart, or the chart itself)
      panel.plot = plot;
      panel.chart = plot.tagName.toLowerCase() === 'svg' ? plot : [...plot.querySelectorAll(':scope > svg')].pop();
      return [panel, plot];
    });
    panels.replaceChildren(...drawn.map(([panel]) => panel));
    const nothing = overActivity && !picks.some((p) => p.shown) ? 'tick an activity to draw it'
                  : ready.length ? 'wheel to zoom, drag to move, double-click to see everything' : 'tick a frame to draw it';
    info.textContent = nothing + (failed.length ? ' (could not load: ' + failed.join('; ') + ')' : '') +
      (without.size ? ' (no ' + xFrame.name + ' for: ' + [...without].join('; ') + ')' : '');
  }

  // The wheel zooms every panel about the pointer, a drag moves them, a double-click shows everything.  (Plot draws, it does
  // not zoom or move: every panel is drawn again on the new span, at most once a frame.)  The listeners are on the panels'
  // container in the capture phase, before the tip's own, which stops a press on a line from going further.
  let pending = false;
  function redraw() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; draw(); });
  }

  // a span of the x axis kept within everything there is to see; null when it is all of it
  function within(span) {
    if (!full) return null;
    const width = span[1] - span[0];
    if (width >= full[1] - full[0]) return null;
    const from = Math.min(Math.max(span[0], full[0]), full[1] - width);
    return [from, from + width];
  }

  // where the pointer is on the x axis of the panel under it (none outside the chart)
  function pointed(e) {
    const panel = e.target.closest ? e.target.closest('.panel') : null;
    if (!panel || !panel.chart || !full) return null;
    const [r0, r1] = panel.plot.scale('x').range;
    const [d0, d1] = zoom || full;
    const px = e.clientX - panel.chart.getBoundingClientRect().left;
    if (px < r0 || px > r1) return null;
    return { value: d0 + (px - r0) / (r1 - r0) * (d1 - d0), perPx: (d1 - d0) / (r1 - r0) };
  }

  panels.addEventListener('wheel', (e) => {
    const p = pointed(e);
    if (!p) return;
    e.preventDefault();
    const [d0, d1] = zoom || full;
    const step = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;   // lines, pages: as pixels
    const k = Math.exp(e.deltaY * step * 0.002);
    zoom = within([p.value - (p.value - d0) * k, p.value + (d1 - p.value) * k]);
    redraw();
  }, { capture: true, passive: false });

  let drag = null;              // { from: where it began (pixels), span: the span then, perPx }
  panels.addEventListener('pointerdown', (e) => {
    const p = e.button === 0 ? pointed(e) : null;
    if (p) drag = { from: e.clientX, span: zoom || full, perPx: p.perPx, moved: false };
  }, { capture: true });
  window.addEventListener('pointermove', (e) => {
    if (!drag || (!drag.moved && Math.abs(e.clientX - drag.from) < 3)) return;
    drag.moved = true;
    const shift = (drag.from - e.clientX) * drag.perPx;
    zoom = within([drag.span[0] + shift, drag.span[1] + shift]);
    redraw();
  });
  window.addEventListener('pointerup', () => { drag = null; });
  panels.addEventListener('dblclick', () => { zoom = null; draw(); }, { capture: true });

  // which frames are ticked: what was ticked the last time, in this browser, for this subject (else the defaults the page
  // was made with); kept again whenever a box changes
  const remembered = 'nch' + location.pathname;
  try {
    const names = JSON.parse(localStorage.getItem(remembered) || 'null');
    if (Array.isArray(names)) for (const f of frames) f.shown = names.includes(f.name);
  } catch (e) { /* (no storage, or what is there is not ours: the defaults) */ }
  const list = document.getElementById('frames');
  for (const f of frames) {
    const label = document.createElement('label');
    label.title = f.summary;
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = f.shown;
    box.addEventListener('change', () => {
      f.shown = box.checked;
      try { localStorage.setItem(remembered, JSON.stringify(frames.filter((g) => g.shown).map((g) => g.name))); }
      catch (e) { /* (no storage: the page works, it just does not remember) */ }
      draw();
    });
    label.append(box, document.createTextNode(' ' + f.name));
    f.label = label;
    list.appendChild(label);
  }
  // the x axis over activities: the time, or a frame that grows along them (remembered, as the frames are)
  const rememberedX = 'nch-x' + location.pathname;
  if (overActivity && alongFrames.length) {
    try { xFrame = alongFrames.find((f) => f.name === localStorage.getItem(rememberedX)) || null; } catch (e) { /* (no storage) */ }
    const choices = document.getElementById('axis');
    choices.append(document.createTextNode('x: '));
    for (const choice of [null, ...alongFrames]) {
      const label = document.createElement('label');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'x';
      radio.checked = choice === xFrame;
      radio.addEventListener('change', () => {
        xFrame = choice;
        hideAxisBox();
        zoom = null;
        try { localStorage.setItem(rememberedX, choice ? choice.name : ''); } catch (e) { /* (no storage) */ }
        draw();
      });
      label.append(radio, document.createTextNode(' ' + (choice ? choice.name : 'time')));
      choices.appendChild(label);
    }
  }

  // the box of the frame that is the x axis is hidden while it is (drawn against itself it would be a diagonal)
  function hideAxisBox() {
    for (const f of frames) if (f.along) f.label.style.display = f === xFrame ? 'none' : '';
  }
  hideAxisBox();

  // the activities to tick (not remembered: which they are changes with the selection); the newest is ticked at first
  const pickList = document.getElementById('picks');
  for (const p of picks) {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = p.shown;
    box.addEventListener('change', () => {
      p.shown = box.checked;
      if (p.shown) takeColour(p); else colourOf.delete(p.label);
      zoom = null;
      draw();
    });
    label.append(box, document.createTextNode(' ' + p.label));
    pickList.appendChild(label);
  }
  draw().catch((e) => { info.textContent = 'could not draw the plot: ' + e; });
  window.addEventListener('resize', () => { draw(); });
</script>
</body>
</html>
