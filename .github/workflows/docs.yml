# The generated documentation (`nimble docs`), published with GitHub Pages on every push to main.
# One-time setting: the repository's Settings > Pages > Source must be "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.4.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the dependencies (writes nimble.paths)
        run: nimble setup -y
      - name: Generate the documentation (stops on a warning)
        run: nimble docs
      - name: Front page
        run: echo '<meta http-equiv="refresh" content="0; url=nch.html">' > doc/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
